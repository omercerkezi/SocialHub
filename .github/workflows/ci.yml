name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: socialhub
          POSTGRES_PASSWORD: socialhub
          POSTGRES_DB: socialhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socialhub -d socialhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://socialhub:socialhub@localhost:5432/socialhub
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret
      ADMIN_EMAIL: owner@socialhub.local
      ADMIN_PASSWORD: change-me
      ADMIN_NAME: Owner
      INTEGRATIONS_MODE: mock
      SEED: "true"
      STORAGE_DIR: ./storage
      WORKER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -w @socialhub/api
      - run: npm run build -w @socialhub/web
