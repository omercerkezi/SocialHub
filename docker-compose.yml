services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: socialhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socialhub}
      POSTGRES_DB: socialhub
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialhub -d socialhub"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://socialhub:${POSTGRES_PASSWORD:-socialhub}@postgres:5432/socialhub
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-owner@socialhub.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      ADMIN_NAME: ${ADMIN_NAME:-Owner}
      INTEGRATIONS_MODE: ${INTEGRATIONS_MODE:-mock}
      SEED: ${SEED:-true}
      STORAGE_DIR: /data/media
      PORT: 3000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8090}
      WORKER_ENABLED: "true"
    volumes:
      - media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8090:80"
    depends_on:
      - api

volumes:
  postgres:
  media:
